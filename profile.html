<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · Recall</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ---------- shared token palette (every page uses this) ---------- */
    :root {
      --bg:        #0D1117;
      --bg-2:      #161B22;
      --bg-3:      #1C2128;
      --bg-4:      #21262D;
      --line:      #21262D;
      --line-2:    #30363D;
      --line-3:    #484F58;
      --text:      #F0F6FC;
      --text-2:    #C9D1D9;
      --text-3:    #8B949E;
      --text-4:    #6E7681;
      --blue:      #58A6FF;
      --blue-2:    #1F6FEB;
      --blue-dim:  rgba(56,139,253,0.15);
      --blue-pale: rgba(56,139,253,0.08);
      --green:     #3FB950;
      --green-dim: rgba(63,185,80,0.12);
      --yellow:    #D29922;
      --yellow-dim:rgba(210,153,34,0.12);
      --red:       #F85149;
      --red-dim:   rgba(248,81,73,0.12);
      --r-sm: 6px;
      --r-md: 8px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ---------- TOP NAV (mirrors staff-dashboard line 53-71) ---------- */
    nav.top {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky; top: 0; z-index: 50;
    }
    nav.top .row {
      max-width: 100%; margin: 0 auto;
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 56px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 15px;
      color: var(--text);
    }
    .brand:hover { text-decoration: none; }
    .brand-mark {
      width: 26px; height: 26px;
      display: block;
      object-fit: cover;
      border-radius: var(--r-sm);
    }
    nav.top .right {
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: var(--text-3);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--line-2);
      padding: 6px 12px;
      border-radius: var(--r-sm);
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--bg-2); color: var(--text); }

    /* ---------- BUTTONS (mirrors staff-dashboard line 293-310) ---------- */
    .btn-primary {
      background: var(--blue); color: #fff;
      padding: 10px 18px; border-radius: var(--r-sm);
      font-family: inherit; font-size: 13.5px; font-weight: 600;
      border: 1px solid var(--blue);
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: var(--blue-2); border-color: var(--blue-2); text-decoration: none; color: #fff; }
    .btn-secondary {
      background: var(--bg-3); color: var(--text);
      border: 1px solid var(--line-2);
      padding: 9px 16px; border-radius: var(--r-sm);
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary:hover { background: var(--bg-4); border-color: var(--line-3); text-decoration: none; color: var(--text); }

    /* ---------- GATE (mirrors staff-dashboard line 312-324) ---------- */
    .gate {
      max-width: 520px;
      margin: 80px auto;
      padding: 32px;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      text-align: center;
    }
    .gate h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    .gate p { color: var(--text-2); margin: 0 0 18px; }
    .gate .muted { color: var(--text-4); font-size: 12px; }

    /* ---------- MAIN (mirrors staff-dashboard line 162-176) ---------- */
    main.profile-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ---------- CARD (mirrors .card on staff-dashboard line 202-218) ---------- */
    .card,
    #identityCard,
    #bioCard,
    #statsCard,
    #mutualsCard,
    #searchCard,
    #actionsCard {
      background: var(--bg-2) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--r-md);
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .card h2 {
      margin: 0 0 14px;
      font-size: 14px; font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .card h2 .meta { font-size: 11.5px; color: var(--text-4); font-weight: 500; }
    .card-empty { color: var(--text-4); font-size: 12.5px; padding: 4px 0; }

    /* ---------- IDENTITY ROW (avatar + name + role pill + school) ---------- */
    .identity {
      display: flex; align-items: center; gap: 18px;
      margin-bottom: 18px;
    }
    .identity .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--bg-3);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 22px;
      overflow: hidden; flex-shrink: 0;
    }
    .identity .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .identity .meta { flex: 1; min-width: 0; }
    .identity .name {
      font-size: 20px; font-weight: 700; color: var(--text);
      letter-spacing: -0.015em; margin: 0 0 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .identity .school { color: var(--text-3); font-size: 13px; }

    /* ---------- ROLE PILL (mirrors staff-dashboard line 84-95) ---------- */
    .role-pill {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      background: var(--bg-3); color: var(--text-3);
      border: 1px solid var(--line-2);
    }
    .role-pill.staff_author,
    .role-pill.staff_reviewer,
    .role-pill.admin       { background: var(--blue-dim); color: var(--blue); border-color: var(--blue); }
    .role-pill.teacher,
    .role-pill.school_organiser { background: var(--green-dim); color: var(--green); border-color: var(--green); }
    .role-pill.student     { background: var(--bg-3); color: var(--text-3); border-color: var(--line-2); }

    /* ---------- BIO ---------- */
    .bio p,
    #bioText {
      margin: 0;
      background: transparent !important;
      color: var(--text-2);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bio p.empty,
    #bioText.empty { color: var(--text-4); font-style: italic; }
    .bio .actions {
      margin-top: 10px;
      display: flex; gap: 8px; justify-content: flex-end; align-items: center;
    }
    .link-btn {
      background: none; border: 0;
      color: var(--blue); cursor: pointer;
      font-family: inherit; font-size: 12.5px;
      padding: 0;
    }
    .link-btn:hover { text-decoration: underline; }
    .bio textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-family: inherit; font-size: 14px;
      resize: vertical;
      min-height: 80px;
    }
    .bio textarea:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-dim);
    }
    .bio .foot {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
    }
    .bio .counter { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
    .bio .spacer { flex: 1; }

    /* ---------- ACTIONS ROW ---------- */
    .cta-row { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
    /* Unfollow = same shape as primary but de-emphasised (secondary tone). */
    .btn-primary.is-following {
      background: var(--bg-3); color: var(--text);
      border-color: var(--line-2);
    }
    .btn-primary.is-following:hover {
      background: var(--bg-4); color: var(--text);
      border-color: var(--line-3);
    }
    .like-btn {
      background: transparent;
      color: var(--text-2);
      border: 1px solid var(--line-2);
      padding: 9px 16px; border-radius: var(--r-sm);
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .like-btn:hover { background: var(--bg-3); color: var(--text); }
    .like-btn .heart { font-size: 14px; line-height: 1; }
    .like-btn .heart::before { content: '♡'; }
    .like-btn.is-liked {
      color: var(--red);
      border-color: var(--red);
      background: var(--red-dim);
    }
    .like-btn.is-liked .heart::before { content: '♥'; }
    .like-btn.is-liked:hover { background: var(--red-dim); color: var(--red); }

    /* ---------- STATS (mirrors staff-dashboard line 178-200) ---------- */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat,
    button.stat,
    .stat[data-open] {
      background: var(--bg-2) !important;
      border: 1px solid var(--line) !important;
      border-radius: var(--r-md);
      padding: 16px 18px;
      cursor: pointer;
      color: var(--text);
      font-family: inherit;
      text-align: left;
    }
    .stat:hover { background: var(--bg-3); }
    .stat:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .stat .label {
      font-size: 11.5px; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    }
    .stat .value {
      display: block;
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.015em;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }
    .stat.readonly { cursor: default; }
    .stat.readonly:hover { background: var(--bg-2); }

    /* ---------- MUTUALS GRID (mirrors .staff-grid on staff-dashboard line 256-290) ---------- */
    .mutuals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
    }
    .mutual-tile {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 12px 10px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease;
      text-decoration: none;
      color: var(--text);
    }
    .mutual-tile:hover { border-color: var(--blue); background: var(--bg-2); text-decoration: none; }
    .mutual-tile .av {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--bg-3);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
      overflow: hidden;
    }
    .mutual-tile .av img { width: 100%; height: 100%; object-fit: cover; }
    .mutual-tile .name {
      font-size: 12.5px; font-weight: 600;
      max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ---------- SEARCH (inside a card) ---------- */
    .search-card .hint { color: var(--text-3); font-size: 13px; margin: 0 0 12px; }
    .search-card .field { position: relative; }
    .search-card input {
      width: 100%;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: 8px 12px;
      font-family: inherit; font-size: 13px;
      outline: none;
    }
    .search-card input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px var(--blue-dim);
    }
    .search-results {
      margin-top: 8px; max-height: 360px; overflow-y: auto;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
    }
    .search-hit {
      display: block;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }
    .search-hit:last-child { border-bottom: 0; }
    .search-hit:hover { background: var(--bg-3); text-decoration: none; }
    .search-hit .who {
      font-size: 13.5px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
    }
    .search-hit .av {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg-3);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #fff;
      overflow: hidden; flex-shrink: 0;
    }
    .search-hit .av img { width: 100%; height: 100%; object-fit: cover; }
    .search-hit .role { color: var(--text-3); font-size: 11.5px; margin-left: auto; }

    /* ---------- LIST MODAL ---------- */
    .modal-back {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 60; padding: 24px;
    }
    .modal-back[hidden] { display: none !important; }
    .modal-card {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      width: 100%; max-width: 480px; max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-card header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .modal-card .list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .list-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px;
      color: var(--text);
      text-decoration: none;
    }
    .list-row:hover { background: var(--bg-3); text-decoration: none; }
    .list-row .av {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--bg-3);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #fff;
      overflow: hidden; flex-shrink: 0;
    }
    .list-row .av img { width: 100%; height: 100%; object-fit: cover; }
    .list-row .name { font-size: 13.5px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .list-row .role { font-size: 11.5px; color: var(--text-3); }
    .list-empty {
      padding: 32px 18px; text-align: center;
      color: var(--text-3); font-size: 13px;
    }

    /* ---------- TOASTS ---------- */
    .toast-wrap {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--bg-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
      padding: 10px 14px; color: var(--text-2); font-size: 13px;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }

    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px;
    }

    /* On the profile page the dropdown head repeats the user name (avatar
       button label + identity card), but the avatar-button name in the top
       nav is the canonical label and stays. */

    /* Hard-pin base-grey boxes. Some page-level CSS from bubbles.js or other
       modules can re-skin these on render; !important keeps the surface
       unambiguously the same dark grey as the "Liked by" tile. */
    .recall-avatar-menu,
    #listModal .modal-card {
      background: var(--bg-2) !important;
      border: 1px solid var(--line-2) !important;
    }

    @media (max-width: 720px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .identity .avatar { width: 56px; height: 56px; }
      .identity .name { font-size: 18px; }
    }
  </style>
</head>
<body>

<nav class="top" id="profileNav" hidden>
  <div class="row">
    <a class="brand" href="index.html">
      <img class="brand-mark" src="logo.png" alt="Recall" /> Recall
    </a>
    <div class="right">
      <span id="userName"></span>
      <div id="avatarSlot" style="display: inline-flex;"></div>
      <div id="bellSlot"></div>
      <button class="btn-ghost" id="signOutBtn" hidden>Sign out</button>
    </div>
  </div>
</nav>

<div id="gate" class="gate" hidden>
  <h1 id="gateTitle">Verifying access…</h1>
  <p id="gateMsg">One moment.</p>
  <p class="muted"><a class="btn-link" href="login.html">Sign in</a> · <a class="btn-link" href="index.html">Back to home</a></p>
</div>

<main class="profile-main" id="profileMain" hidden>

  <!-- IDENTITY CARD -->
  <div class="card" id="identityCard" hidden>
    <div class="identity">
      <div class="avatar" id="avatarBig"></div>
      <div class="meta">
        <div class="name" id="displayName">…</div>
        <span class="role-pill" id="rolePill"></span>
        <div class="school" id="schoolLine"></div>
      </div>
    </div>
  </div>

  <!-- BIO CARD -->
  <div class="card bio" id="bioCard" hidden>
    <h2>About</h2>
    <p id="bioText" class="empty">You haven't written a bio yet.</p>
    <div class="actions" id="bioActions" hidden>
      <button class="link-btn" type="button" id="editBioBtn">Edit bio</button>
    </div>
    <form id="bioForm" hidden>
      <textarea id="bioInput" maxlength="500" rows="4"
                placeholder="Tell people about yourself…"></textarea>
      <div class="foot">
        <span class="counter" id="bioCounter">0 / 500</span>
        <span class="spacer"></span>
        <button class="btn-ghost" type="button" id="bioCancel">Cancel</button>
        <button class="btn-primary" type="submit" id="bioSave">Save</button>
      </div>
    </form>
  </div>

  <!-- ACTIONS CARD (follow / message / like) -->
  <div class="card" id="actionsCard" hidden>
    <h2>Connect</h2>
    <div class="cta-row">
      <button class="btn-primary" type="button" id="followBtn" hidden>Follow</button>
      <button class="btn-ghost"  type="button" id="messageBtn" hidden>Message</button>
      <button class="like-btn"   type="button" id="likeBtn" hidden>
        <span class="heart"></span>
        <span>Like</span>
        <span id="likeCount">0</span>
      </button>
    </div>
  </div>

  <!-- STATS CARD -->
  <div class="card" id="statsCard" hidden>
    <h2>Activity</h2>
    <div class="stats">
      <button class="stat" type="button" data-open="followers">
        <div class="label">Followers</div>
        <span class="value" id="statFollowers">0</span>
      </button>
      <button class="stat" type="button" data-open="following">
        <div class="label">Following</div>
        <span class="value" id="statFollowing">0</span>
      </button>
      <button class="stat" type="button" data-open="mutuals">
        <div class="label">Mutual friends</div>
        <span class="value" id="statMutuals">0</span>
      </button>
      <div class="stat readonly">
        <div class="label">Liked by</div>
        <span class="value" id="statLikedBy">0</span>
      </div>
    </div>
  </div>

  <!-- MUTUAL FRIENDS CARD -->
  <div class="card" id="mutualsCard" hidden>
    <h2>Mutual friends <span class="meta" id="mutualsMeta"></span></h2>
    <div id="mutualsGrid" class="mutuals-grid"></div>
  </div>

  <!-- FIND PEOPLE CARD -->
  <div class="card search-card" id="searchCard" hidden>
    <h2>Find people to follow</h2>
    <p class="hint">Type a name. Results open in a new tab.</p>
    <div class="field">
      <input id="searchInput" type="search" placeholder="Search by name…" autocomplete="off" />
      <div id="searchResults" class="search-results" hidden></div>
    </div>
  </div>

</main>

<!-- List modal -->
<div id="listModal" class="modal-back" hidden>
  <div class="modal-card">
    <header>
      <h3 id="listModalTitle">List</h3>
      <button class="link-btn" type="button" id="listClose">Close</button>
    </header>
    <div id="listModalBody" class="list"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="topbar.js" defer></script>
<script src="header-avatar.js" defer></script>
<script src="chat.js" defer></script>
<script src="bubbles.js" defer></script>
<script src="profile.js" defer></script>
</body>
</html>
