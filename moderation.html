<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderation queue — Recall Education</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root {
      --bg:        #0D1117;
      --bg-2:      #161B22;
      --bg-3:      #1C2128;
      --bg-4:      #21262D;
      --line:      #21262D;
      --line-2:    #30363D;
      --line-3:    #484F58;
      --text:      #F0F6FC;
      --text-2:    #C9D1D9;
      --text-3:    #8B949E;
      --text-4:    #6E7681;
      --blue:      #58A6FF;
      --blue-2:    #1F6FEB;
      --blue-pale: rgba(56,139,253,0.08);
      --blue-dim:  rgba(56,139,253,0.15);
      --green:     #3FB950;
      --yellow:    #D29922;
      --red:       #F85149;
      --r-sm: 6px;
      --r-md: 8px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .hidden { display: none !important; }

    /* ---------- Top nav (mirrors admin.html) ---------- */
    .top {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky; top: 0; z-index: 5;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 16px;
      color: var(--text);
    }
    .brand:hover { text-decoration: none; }
    .brand .logo {
      width: 26px; height: 26px;
      display: block;
      object-fit: cover;
      border-radius: var(--r-sm);
    }
    .mod-pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(210, 153, 34, 0.15);
      color: #e3b341;
      border: 1px solid rgba(210, 153, 34, 0.4);
    }
    .top .right {
      margin-left: auto;
      display: flex; align-items: center; gap: 14px;
      font-size: 13px;
      color: var(--text-3);
    }
    .top .right .me { color: var(--text-2); font-weight: 500; }
    .top .right a { color: var(--text-2); }
    .top .right a:hover { color: var(--blue); }

    /* ---------- Main ---------- */
    main {
      padding: 28px 32px 64px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .page-head {
      display: flex; align-items: baseline; gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .page-head h1 {
      font-size: 22px; font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0;
    }
    .page-head .desc { color: var(--text-3); font-size: 13.5px; }

    /* ---------- Filter pills ---------- */
    .filters {
      display: flex; gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .filter-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px;
      border-radius: var(--r-sm);
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      color: var(--text-2);
      font-family: inherit; font-size: 12.5px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .filter-pill:hover { background: var(--bg-3); color: var(--text); }
    .filter-pill.active {
      background: var(--blue-dim);
      color: var(--blue);
      border-color: rgba(56, 139, 253, 0.4);
    }
    .filter-pill .count {
      font-size: 11px;
      background: var(--bg-3);
      color: var(--text-3);
      padding: 1px 6px;
      border-radius: 999px;
      min-width: 18px;
      text-align: center;
    }
    .filter-pill.active .count { background: var(--blue); color: #fff; }

    /* ---------- Flag rows ---------- */
    .flags-list {
      display: flex; flex-direction: column; gap: 12px;
    }
    .flag-card {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: 16px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
    }
    .flag-main { min-width: 0; }
    .flag-meta {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .kind-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .kind-pill.bio { background: rgba(56, 139, 253, 0.15); color: #79b8ff; }
    .kind-pill.name { background: rgba(63, 185, 80, 0.12); color: #56d364; }
    .kind-pill.dm { background: rgba(248, 81, 73, 0.15); color: #ff9a93; }
    .flag-time { font-size: 12px; color: var(--text-4); }
    .flag-submitter { font-size: 12.5px; color: var(--text-3); }
    .flag-submitter strong { color: var(--text-2); font-weight: 600; }
    .flag-text {
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.5;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      margin: 0 0 10px 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 180px;
      overflow: auto;
    }
    .flag-terms {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 4px;
    }
    .term-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(248, 81, 73, 0.15);
      color: #ff9a93;
      border: 1px solid rgba(248, 81, 73, 0.4);
    }

    .flag-actions {
      display: flex; flex-direction: column; gap: 8px;
      align-items: flex-end;
    }
    .flag-actions button {
      padding: 6px 12px;
      border-radius: var(--r-sm);
      font-family: inherit; font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      min-width: 92px;
    }
    .btn-approve {
      background: rgba(63, 185, 80, 0.12);
      color: #56d364;
      border-color: rgba(63, 185, 80, 0.4);
    }
    .btn-approve:hover { background: rgba(63, 185, 80, 0.2); }
    .btn-reject {
      background: rgba(248, 81, 73, 0.12);
      color: #ff9a93;
      border-color: rgba(248, 81, 73, 0.4);
    }
    .btn-reject:hover { background: rgba(248, 81, 73, 0.2); }
    .btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: default; }

    /* ---------- Empty state ---------- */
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-4);
      background: var(--bg-2);
      border: 1px dashed var(--line-2);
      border-radius: var(--r-md);
    }
    .empty .title { color: var(--text-2); font-size: 14px; margin-bottom: 4px; }

    /* ---------- Gate ---------- */
    .gate {
      max-width: 460px;
      margin: 80px auto;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: 30px 28px;
      text-align: center;
    }
    .gate h1 { font-size: 18px; margin: 0 0 8px; }
    .gate p { color: var(--text-3); margin: 0 0 16px; font-size: 13.5px; }
    .gate a {
      display: inline-block;
      padding: 8px 16px;
      background: var(--blue);
      color: #fff;
      border-radius: var(--r-sm);
      font-weight: 600;
    }
    .gate a:hover { background: var(--blue-2); text-decoration: none; }

    /* ---------- Modal ---------- */
    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      max-width: 460px;
      width: 100%;
      padding: 22px 22px 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .modal-card h2 { font-size: 16px; margin: 0 0 8px; }
    .modal-card .warning {
      font-size: 13px;
      color: var(--text-2);
      background: rgba(248, 81, 73, 0.10);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      margin: 0 0 14px;
    }
    .modal-card label {
      display: block;
      font-size: 12px;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .modal-card textarea {
      width: 100%;
      min-height: 70px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      resize: vertical;
    }
    .modal-card textarea:focus {
      outline: none;
      border-color: var(--blue);
    }
    .modal-actions {
      display: flex; justify-content: flex-end; gap: 8px;
      margin-top: 14px;
    }
    .modal-actions button {
      padding: 7px 14px;
      border-radius: var(--r-sm);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-cancel {
      background: var(--bg-3);
      color: var(--text-2);
      border-color: var(--line-2);
    }
    .btn-cancel:hover { background: var(--bg-4); color: var(--text); }
    .btn-danger {
      background: var(--red);
      color: #fff;
    }
    .btn-danger:hover { background: #d83a32; }
    .btn-danger:disabled { opacity: 0.5; cursor: default; }

    /* ---------- Toast ---------- */
    #toast {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      z-index: 200;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--red); color: #ff9a93; }
    #toast.success { border-color: var(--green); color: #56d364; }
  </style>
</head>
<body>
  <div id="gate" class="hidden">
    <div class="gate">
      <h1 id="gateTitle">Sign-in required</h1>
      <p id="gateBody">Sign in to use the moderation queue.</p>
      <a href="login.html" id="gateLink">Sign in</a>
    </div>
  </div>

  <div id="app" class="hidden">
    <nav class="top">
      <a class="brand" href="admin.html">
        <img class="logo" src="logo.png" alt="Recall">
        Recall
      </a>
      <span class="mod-pill">Moderation</span>
      <div class="right">
        <span id="bellSlot"></span>
        <span id="avatarSlot"></span>
        <a href="admin.html">Back to admin</a>
      </div>
    </nav>

    <main>
      <div class="page-head">
        <h1>Moderation queue</h1>
        <span class="desc">Review and resolve flagged content from bios, names, and DM messages.</span>
      </div>

      <div class="filters" id="filters">
        <button class="filter-pill active" data-kind="all" type="button">
          All <span class="count" id="countAll">0</span>
        </button>
        <button class="filter-pill" data-kind="bio" type="button">
          Bio <span class="count" id="countBio">0</span>
        </button>
        <button class="filter-pill" data-kind="name" type="button">
          Name <span class="count" id="countName">0</span>
        </button>
        <button class="filter-pill" data-kind="dm" type="button">
          DM <span class="count" id="countDm">0</span>
        </button>
      </div>

      <div id="flagsList" class="flags-list"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hkjiyibpeqdoqzlyqzwz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhraml5aWJwZXFkb3F6bHlxend6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MzkxNDgsImV4cCI6MjA5OTQxNTE0OH0.UGVZ0-b9-c7JVtu006mmyfj0NkIbpmmn0wCNNqdi9iU';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: {
        fetch: (url, options = {}) => {
          try {
            const u = new URL(url, window.location.href);
            if (u.host.endsWith('.supabase.co') && !u.searchParams.has('apikey')) {
              u.searchParams.set('apikey', SUPABASE_ANON_KEY);
            }
            return fetch(u.toString(), options);
          } catch (_) { return fetch(url, options); }
        }
      }
    });
    window.supabaseClient = supabaseClient;
  </script>
  <script src="topbar.js" defer></script>
  <script src="header-avatar.js" defer></script>
  <script>
    'use strict';

    // ---------- helpers ----------
    function $(id) { return document.getElementById(id); }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function fmtRelative(iso) {
      if (!iso) return '';
      const then = new Date(iso).getTime();
      if (isNaN(then)) return '';
      const diffSec = Math.max(0, (Date.now() - then) / 1000);
      if (diffSec < 60)        return 'just now';
      if (diffSec < 3600)      return Math.floor(diffSec / 60) + 'm ago';
      if (diffSec < 86400)     return Math.floor(diffSec / 3600) + 'h ago';
      if (diffSec < 86400 * 7) return Math.floor(diffSec / 86400) + 'd ago';
      return new Date(iso).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }
    function showToast(msg, kind) {
      const t = $('toast');
      t.textContent = msg;
      t.className = '';
      t.classList.add('show');
      if (kind) t.classList.add(kind);
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 2400);
    }

    function showGate(title, body, kind) {
      $('gateTitle').textContent = title;
      $('gateBody').textContent = body;
      const link = $('gateLink');
      if (kind === 'signin')      { link.textContent = 'Sign in';      link.href = 'login.html'; }
      else if (kind === 'noaccess') { link.textContent = 'Back to home'; link.href = 'index.html'; }
      else                        { link.textContent = 'Sign in';      link.href = 'login.html'; }
      $('gate').classList.remove('hidden');
      $('app').classList.add('hidden');
    }

    // ---------- state ----------
    let state = {
      user: null,
      role: null,
      filter: 'all',
      flags: [],
      counts: { all: 0, bio: 0, name: 0, dm: 0 },
      realtimeChannel: null,
    };

    // ---------- list & render ----------
    async function refreshCounts() {
      // For each kind, count pending. Cheap because of the status index.
      const sb = supabaseClient;
      const kinds = ['bio', 'name', 'dm'];
      const all = await sb.rpc('list_pending_moderation_flags', { p_kind: null, p_limit: 200 });
      state.counts.all = (all.data || []).length;
      for (const k of kinds) {
        const r = await sb.rpc('list_pending_moderation_flags', { p_kind: k, p_limit: 200 });
        state.counts[k] = (r.data || []).length;
      }
      $('countAll').textContent = state.counts.all;
      $('countBio').textContent = state.counts.bio;
      $('countName').textContent = state.counts.name;
      $('countDm').textContent = state.counts.dm;
    }

    async function refreshQueue() {
      const sb = supabaseClient;
      const kind = state.filter === 'all' ? null : state.filter;
      const { data, error } = await sb.rpc('list_pending_moderation_flags', {
        p_kind: kind,
        p_limit: 50
      });
      if (error) {
        showToast('Could not load queue', 'error');
        return;
      }
      state.flags = data || [];
      renderFlags();
      // Refresh counts (the active filter's count + the totals).
      refreshCounts().catch(() => {});
    }

    function renderFlags() {
      const list = $('flagsList');
      list.innerHTML = '';
      if (!state.flags.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '<div class="title">No pending flags</div>' +
          '<div>Nothing to review right now.</div>';
        list.appendChild(empty);
        return;
      }
      for (const f of state.flags) list.appendChild(renderFlag(f));
    }

    function renderFlag(f) {
      const card = document.createElement('div');
      card.className = 'flag-card';
      card.dataset.id = f.id;

      const main = document.createElement('div');
      main.className = 'flag-main';

      const meta = document.createElement('div');
      meta.className = 'flag-meta';

      const kindPill = document.createElement('span');
      kindPill.className = 'kind-pill ' + f.kind;
      kindPill.textContent = f.kind;
      meta.appendChild(kindPill);

      const submitter = document.createElement('span');
      submitter.className = 'flag-submitter';
      submitter.innerHTML = 'by <strong>' +
        escapeHtml(f.submitter_name || 'unknown user') + '</strong>';
      meta.appendChild(submitter);

      const time = document.createElement('span');
      time.className = 'flag-time';
      time.textContent = fmtRelative(f.created_at);
      meta.appendChild(time);

      main.appendChild(meta);

      const text = document.createElement('pre');
      text.className = 'flag-text';
      text.textContent = f.submitted_text || '(empty)';
      main.appendChild(text);

      if (f.flagged_terms && f.flagged_terms.length) {
        const terms = document.createElement('div');
        terms.className = 'flag-terms';
        for (const t of f.flagged_terms) {
          const chip = document.createElement('span');
          chip.className = 'term-chip';
          chip.textContent = t;
          terms.appendChild(chip);
        }
        main.appendChild(terms);
      }

      card.appendChild(main);

      const actions = document.createElement('div');
      actions.className = 'flag-actions';

      const approveBtn = document.createElement('button');
      approveBtn.className = 'btn-approve';
      approveBtn.type = 'button';
      approveBtn.textContent = 'Approve';
      approveBtn.addEventListener('click', () => approve(f.id, approveBtn));
      actions.appendChild(approveBtn);

      const rejectBtn = document.createElement('button');
      rejectBtn.className = 'btn-reject';
      rejectBtn.type = 'button';
      rejectBtn.textContent = 'Reject';
      rejectBtn.addEventListener('click', () => openRejectModal(f, rejectBtn));
      actions.appendChild(rejectBtn);

      card.appendChild(actions);
      return card;
    }

    // ---------- actions ----------
    async function approve(flagId, btn) {
      if (btn) btn.disabled = true;
      const { error } = await supabaseClient.rpc('resolve_moderation_flag', {
        p_flag_id: flagId,
        p_action: 'approve',
        p_notes: null
      });
      if (btn) btn.disabled = false;
      if (error) {
        showToast('Could not approve: ' + (error.message || 'error'), 'error');
        return;
      }
      showToast('Approved', 'success');
      refreshQueue();
    }

    function openRejectModal(f, btn) {
      const root = $('modalRoot');
      root.innerHTML = '';

      const bg = document.createElement('div');
      bg.className = 'modal-bg';

      const card = document.createElement('div');
      card.className = 'modal-card';

      const h2 = document.createElement('h2');
      h2.textContent = 'Reject this ' + f.kind + ' flag?';
      card.appendChild(h2);

      const warn = document.createElement('div');
      warn.className = 'warning';
      if (f.kind === 'bio') warn.textContent = "The user's bio will be cleared.";
      else if (f.kind === 'name') warn.textContent = "The user's display name will be replaced with '(redacted)'.";
      else if (f.kind === 'dm') warn.textContent = 'This DM message will be deleted from the conversation.';
      card.appendChild(warn);

      const label = document.createElement('label');
      label.textContent = 'Notes (optional)';
      card.appendChild(label);

      const ta = document.createElement('textarea');
      ta.placeholder = 'Add a note for the audit trail…';
      card.appendChild(ta);

      const actions = document.createElement('div');
      actions.className = 'modal-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn-cancel';
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => { root.innerHTML = ''; });
      actions.appendChild(cancelBtn);

      const rejectConfirm = document.createElement('button');
      rejectConfirm.className = 'btn-danger';
      rejectConfirm.type = 'button';
      rejectConfirm.textContent = 'Reject';
      rejectConfirm.addEventListener('click', async () => {
        rejectConfirm.disabled = true;
        cancelBtn.disabled = true;
        const { error } = await supabaseClient.rpc('resolve_moderation_flag', {
          p_flag_id: f.id,
          p_action: 'reject',
          p_notes: ta.value.trim() || null
        });
        if (error) {
          showToast('Could not reject: ' + (error.message || 'error'), 'error');
          rejectConfirm.disabled = false;
          cancelBtn.disabled = false;
          return;
        }
        root.innerHTML = '';
        showToast('Rejected', 'success');
        refreshQueue();
      });
      actions.appendChild(rejectConfirm);

      card.appendChild(actions);
      bg.appendChild(card);
      root.appendChild(bg);

      // Click outside to dismiss.
      bg.addEventListener('click', (ev) => {
        if (ev.target === bg) root.innerHTML = '';
      });

      ta.focus();
    }

    // ---------- filter wiring ----------
    function applyFilter(kind) {
      state.filter = kind;
      document.querySelectorAll('.filter-pill').forEach((p) => {
        p.classList.toggle('active', p.dataset.kind === kind);
      });
      refreshQueue();
    }
    document.querySelectorAll('.filter-pill').forEach((p) => {
      p.addEventListener('click', () => applyFilter(p.dataset.kind));
    });

    // ---------- realtime ----------
    function subscribeRealtime() {
      try {
        state.realtimeChannel = supabaseClient
          .channel('moderation-flags')
          .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'moderation_flags'
          }, () => {
            refreshQueue();
          })
          .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'moderation_flags'
          }, () => {
            refreshQueue();
          })
          .subscribe();
      } catch (e) {
        console.warn('realtime subscribe failed:', e);
      }
    }

    window.addEventListener('beforeunload', () => {
      if (state.realtimeChannel) supabaseClient.removeChannel(state.realtimeChannel);
    });

    // ---------- boot ----------
    async function boot() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error || !data?.user) {
        showGate('Sign-in required', 'Sign in to use the moderation queue.', 'signin');
        return;
      }
      state.user = data.user;

      // Resolve role from DB. Falls back to JWT claim if the RPC isn't
      // installed (older migrations).
      let role = null;
      try {
        const r = await supabaseClient.rpc('current_role');
        if (!r.error && r.data) role = r.data;
      } catch (_) { /* fall through */ }
      if (!role) role = data.user.app_metadata?.role;

      if (role !== 'admin' && role !== 'staff_reviewer') {
        showGate(
          'Staff access only',
          'Your account is signed in, but it does not have moderation permissions. Ask an existing admin to promote you.',
          'noaccess'
        );
        return;
      }
      state.role = role;

      // Mount the shared header pieces.
      function mountBell() {
        if (!window.recallTopbar) { setTimeout(mountBell, 50); return; }
        window.recallTopbar.mount('bellSlot', { supabaseClient, user: data.user });
      }
      mountBell();

      async function mountAvatar() {
        if (!window.recallHeaderAvatar) { setTimeout(mountAvatar, 50); return; }
        let avatarProfile = { id: data.user.id, full_name: '', role: role, avatar_url: null };
        try {
          const { data: p } = await supabaseClient
            .from('profiles').select('id, full_name, avatar_url').eq('id', data.user.id).maybeSingle();
          if (p) {
            avatarProfile.id = p.id;
            avatarProfile.full_name = p.full_name || avatarProfile.full_name;
            avatarProfile.avatar_url = p.avatar_url;
          }
        } catch (_) { /* fall through */ }
        window.recallHeaderAvatar.mount('avatarSlot', {
          supabaseClient, user: data.user, profile: avatarProfile
        });
      }
      mountAvatar();

      $('gate').classList.add('hidden');
      $('app').classList.remove('hidden');

      subscribeRealtime();
      refreshQueue();
    }
    boot();
  </script>
</body>
</html>
