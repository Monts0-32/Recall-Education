<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subjects — Recall</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Theme tokens mirror dashboard.html so the page feels like a
       natural extension of the dashboard. */
    :root {
      --bg:        #0D1117;
      --bg-2:      #161B22;
      --bg-3:      #1C2128;
      --bg-4:      #21262D;
      --line:      #21262D;
      --line-2:    #30363D;
      --line-3:    #484F58;
      --text:      #F0F6FC;
      --text-2:    #C9D1D9;
      --text-3:    #8B949E;
      --text-4:    #6E7681;
      --blue:      #58A6FF;
      --blue-2:    #1F6FEB;
      --blue-dim:  rgba(56,139,253,0.15);
      --blue-pale: rgba(56,139,253,0.08);
      --green:     #3FB950;
      --yellow:    #D29922;
      --red:       #F85149;
      --r-sm: 6px;
      --r-md: 8px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    nav.top {
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky; top: 0; z-index: 50;
    }
    nav.top .row {
      max-width: 1280px; margin: 0 auto;
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 700; color: var(--text);
    }
    .brand .logo { width: 24px; height: 24px; border-radius: 5px; }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .crumbs {
      display: flex; align-items: center; gap: 8px;
      color: var(--text-3);
      font-size: 13px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .crumbs a { color: var(--text-3); }
    .crumbs a:hover { color: var(--blue); text-decoration: none; }
    .crumbs .sep { color: var(--text-4); }
    .crumbs .current { color: var(--text); font-weight: 600; }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }
    .sub {
      color: var(--text-3);
      margin: 0 0 22px;
      font-size: 14px;
    }

    .state {
      padding: 14px 18px;
      border-radius: var(--r-md);
      border: 1px solid var(--line-2);
      background: var(--bg-2);
      margin-bottom: 18px;
      display: none;
    }
    .state.show { display: block; }
    .state.error { border-color: rgba(248,81,73,0.4); background: rgba(248,81,73,0.08); color: #ff9a93; }
    .skel {
      color: var(--text-3);
      font-style: italic;
      padding: 32px;
      text-align: center;
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
    }

    /* Catalogue grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .tile {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.12s ease, background 0.12s ease;
      color: var(--text);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
    }
    .tile:hover {
      border-color: var(--line-3);
      background: var(--bg-3);
      text-decoration: none;
    }
    .tile .head {
      display: flex; align-items: center; gap: 10px;
    }
    .tile .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--blue);
    }
    .tile .name {
      font-weight: 700;
      font-size: 16px;
      margin: 0;
    }
    .tile .meta {
      font-size: 12px;
      color: var(--text-3);
    }

    /* Tree */
    .unit {
      background: var(--bg-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: 22px 24px;
      margin-bottom: 22px;
    }
    .unit-head {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px;
    }
    .unit-head .num {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--bg-4);
      color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex: 0 0 auto;
    }
    .unit-head .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }
    .unit .desc {
      color: var(--text-3);
      font-size: 13px;
      margin: 0 0 18px 42px;
    }
    .topic {
      margin-left: 42px;
      padding: 12px 0;
      border-left: 2px solid var(--line-2);
      padding-left: 18px;
      position: relative;
    }
    .topic::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 22px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg-4);
      border: 2px solid var(--line-2);
    }
    .topic-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      margin: 0 0 12px;
    }
    .lessons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .lesson-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.06s ease, border-color 0.12s ease;
      max-width: 280px;
    }
    .lesson-chip:hover {
      border-color: var(--blue);
      text-decoration: none;
      transform: translateY(-1px);
    }
    .lesson-chip .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .lesson-chip.completed {
      border-color: rgba(63, 185, 80, 0.4);
      background: rgba(63, 185, 80, 0.08);
    }
    .lesson-chip.completed .icon { background: var(--green); color: #fff; }
    .lesson-chip.locked { opacity: 0.45; cursor: not-allowed; }
    .lesson-chip.locked:hover { transform: none; border-color: var(--line-2); }
    .lesson-chip.locked .icon { background: var(--bg-4); color: var(--text-4); }
    .lesson-chip.available { border-color: rgba(56, 139, 253, 0.4); }
    .lesson-chip.available .icon { background: var(--blue); color: #fff; }
    .lesson-chip .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 600px) {
      main { padding: 20px 16px 60px; }
      h1 { font-size: 22px; }
      .unit { padding: 16px; }
      .topic { margin-left: 0; padding-left: 14px; }
    }
  </style>
</head>
<body>
  <nav class="top">
    <div class="row">
      <a class="brand" href="dashboard.html">
        <img class="logo" src="logo.png" alt="Recall" />
        Recall
      </a>
    </div>
  </nav>

  <main>
    <div class="crumbs" id="crumbs"></div>
    <h1 id="pageTitle">Subjects</h1>
    <p class="sub" id="pageSub">Loading…</p>

    <div class="state" id="state"></div>
    <div id="content"><div class="skel">Loading…</div></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4"></script>
  <script>
    const SUPABASE_URL = 'https://hkjiyibpeqdoqzlyqzwz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_eCBuj0Ab6w5LPNnfnKkQTA_xd2vVImv';
    // Use a local name; `const supabase` would collide with the
    // `var supabase` the @supabase UMD bundle declares at top level.
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      // apikey fallback for browsers that strip the apikey header.
      global: {
        fetch: (url, options = {}) => {
          try {
            const u = new URL(url, window.location.href);
            if (u.host.endsWith('.supabase.co') && !u.searchParams.has('apikey')) {
              u.searchParams.set('apikey', SUPABASE_ANON_KEY);
            }
            return fetch(u.toString(), options);
          } catch (_) {
            return fetch(url, options);
          }
        }
      }
    });

    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function showErr(msg) {
      const el = $('state');
      el.className = 'state show error';
      el.textContent = msg;
    }
    function clearErr() {
      const el = $('state');
      el.className = 'state';
      el.textContent = '';
    }

    const params = new URLSearchParams(window.location.search);
    const step = params.get('step') || 'subjects';

    function setCrumbs(parts) {
      $('crumbs').innerHTML = parts.map((p, i) => {
        const last = i === parts.length - 1;
        return (last
          ? `<span class="current">${esc(p.label)}</span>`
          : `<a href="${esc(p.href)}">${esc(p.label)}</a><span class="sep">/</span>`);
      }).join(' ');
    }

    async function init() {
      clearErr();

      // Auth gate.
      const { data: sessData } = await supabaseClient.auth.getSession();
      const session = sessData && sessData.session;
      if (!session) {
        const next = encodeURIComponent(window.location.pathname + window.location.search);
        window.location.href = `login.html?next=${next}`;
        return;
      }

      if (step === 'subjects')      await renderSubjects();
      else if (step === 'board')    await renderBoard();
      else if (step === 'year')     await renderYear();
      else if (step === 'tree')     await renderTree();
      else {
        $('content').innerHTML = '';
        showErr('Unknown step. Use the link in the sidebar.');
      }
    }

    // ---- step 1: catalogue ---------------------------------------------
    async function renderSubjects() {
      $('pageTitle').textContent = 'Choose a subject';
      $('pageSub').textContent = 'Pick a subject to start your learning path.';
      setCrumbs([{ label: 'Subjects' }]);
      $('content').innerHTML = '<div class="skel">Loading subjects…</div>';

      const { data, error } = await supabaseClient.rpc('list_subjects_published');
      if (error) {
        $('content').innerHTML = '';
        showErr('Couldn\'t load subjects: ' + error.message);
        return;
      }

      // Group by (name, level) — same subject can appear under multiple
      // exam boards; collapse them into one tile.
      const groups = new Map();
      for (const row of data || []) {
        const key = `${row.name}__${row.level}`;
        if (!groups.has(key)) {
          groups.set(key, {
            name: row.name, level: row.level, color_key: row.color_key,
            count: 0, first_id: row.subject_id,
          });
        }
        const g = groups.get(key);
        g.count += Number(row.published_count || 0);
      }

      const rows = [...groups.values()].sort((a, b) => a.name.localeCompare(b.name));
      if (rows.length === 0) {
        $('content').innerHTML = '<div class="skel">No subjects are published yet. Check back soon.</div>';
        return;
      }

      // Dot color: keep it simple — map the colour key directly.
      const dotStyle = (key) => {
        const allowed = ['maths','eng','bio','chem','phys','hist','geog','psych'];
        return allowed.includes(String(key || '').toLowerCase()) ? key : '';
      }

      $('content').innerHTML = `<div class="grid">${rows.map(r => `
        <a class="tile" href="subjects.html?step=board&subject=${encodeURIComponent(r.first_id)}">
          <div class="head">
            <span class="dot ${esc(dotStyle(r.color_key))}"></span>
            <h3 class="name">${esc(r.name)}</h3>
          </div>
          <span class="meta">${esc(r.level)}</span>
          <span class="meta">${r.count} published lesson${r.count === 1 ? '' : 's'}</span>
        </a>
      `).join('')}</div>`;
    }

    // ---- step 2: board picker -------------------------------------------
    async function renderBoard() {
      const subjectId = params.get('subject');
      if (!subjectId) { showErr('Missing subject.'); return; }

      $('pageTitle').textContent = 'Pick a board';
      $('pageSub').textContent = 'Every subject starts with a Curriculum base. Pick which one to study.';
      setCrumbs([
        { label: 'Subjects', href: 'subjects.html' },
        { label: 'Board' },
      ]);
      $('content').innerHTML = '<div class="skel">Loading boards…</div>';

      const { data, error } = await supabaseClient.rpc('list_boards_for_subject', {
        p_subject: subjectId,
      });
      if (error) {
        $('content').innerHTML = '';
        showErr('Couldn\'t load: ' + error.message);
        return;
      }

      const rows = data || [];
      if (rows.length === 0) {
        $('content').innerHTML = '<div class="skel">No boards set up for this subject yet.</div>';
        return;
      }

      // Surface the subject name in the breadcrumb. We don't have it from
      // list_boards_for_subject, so peek the catalogue row for context.
      const { data: subjRows } = await supabaseClient
        .from('subjects').select('name').eq('id', subjectId).maybeSingle();
      if (subjRows && subjRows.name) {
        $('crumbs').innerHTML = `
          <a href="subjects.html">Subjects</a>
          <span class="sep">/</span>
          <span class="current">${esc(subjRows.name)}</span>`;
      }

      // If exactly one board AND it has exactly one year, fast-forward to
      // the tree. This preserves the "single board, single year" UX.
      let fastForward = false;
      if (rows.length === 1) {
        const only = rows[0];
        const { data: years } = await supabaseClient.rpc('list_years_for_subject_board', {
          p_subject: subjectId, p_board: only.board_id,
        });
        if ((years || []).length === 1) {
          const y = years[0];
          fastForward = true;
          window.location.replace(
            `subjects.html?step=tree&subject=${encodeURIComponent(subjectId)}` +
            `&boardName=${encodeURIComponent(only.name)}` +
            `&yearId=${encodeURIComponent(y.year_id)}` +
            `&yearLabel=${encodeURIComponent(y.label)}`
          );
          return;
        }
      }

      if (!fastForward) {
        $('content').innerHTML = `<div class="grid">${rows.map(b => {
          const badge = b.kind === 'curriculum' ? 'Base · Years 7–9'
                      : b.kind === 'exam_board'  ? 'Exam board'
                      : 'Course';
          const count = Number(b.lesson_count || 0);
          return `
            <a class="tile" href="subjects.html?step=year&subject=${encodeURIComponent(subjectId)}&boardName=${encodeURIComponent(b.name)}">
              <div class="head"><h3 class="name">${esc(b.name)}</h3></div>
              <span class="meta">${esc(badge)}</span>
              <span class="meta">${count} published lesson${count === 1 ? '' : 's'}</span>
            </a>`;
        }).join('')}</div>`;
      }
    }

    // ---- step 3: year picker -------------------------------------------
    async function renderYear() {
      const subjectId = params.get('subject');
      const boardName = params.get('boardName');
      if (!subjectId || !boardName) { showErr('Missing subject or board.'); return; }

      $('pageTitle').textContent = 'Pick a year';
      $('pageSub').textContent = 'Each board has its own year set. Pick one to start your path.';
      $('content').innerHTML = '<div class="skel">Loading years…</div>';

      // Resolve board name → board_id via list_boards_for_subject.
      const { data: boards, error: bErr } = await supabaseClient.rpc('list_boards_for_subject', {
        p_subject: subjectId,
      });
      if (bErr) {
        $('content').innerHTML = '';
        showErr('Couldn\'t look up board: ' + bErr.message);
        return;
      }
      const board = (boards || []).find(b => b.name === boardName);
      if (!board) {
        $('content').innerHTML = '';
        showErr('Board "' + boardName + '" not found for this subject.');
        return;
      }

      const { data: years, error: yErr } = await supabaseClient.rpc('list_years_for_subject_board', {
        p_subject: subjectId, p_board: board.board_id,
      });
      if (yErr) {
        $('content').innerHTML = '';
        showErr('Couldn\'t load years: ' + yErr.message);
        return;
      }

      // Peek subject name for breadcrumb.
      const { data: subjRow } = await supabaseClient
        .from('subjects').select('name').eq('id', subjectId).maybeSingle();
      $('crumbs').innerHTML = `
        <a href="subjects.html">Subjects</a>
        <span class="sep">/</span>
        <a href="subjects.html?step=board&subject=${encodeURIComponent(subjectId)}">${esc(subjRow ? subjRow.name : 'Subject')}</a>
        <span class="sep">/</span>
        <span class="current">${esc(boardName)}</span>`;

      const rows = years || [];
      if (rows.length === 0) {
        $('content').innerHTML = '<div class="skel">No years set up for this board yet.</div>';
        return;
      }
      if (rows.length === 1) {
        // Single year → straight to tree.
        const y = rows[0];
        window.location.replace(
          `subjects.html?step=tree&subject=${encodeURIComponent(subjectId)}` +
          `&boardName=${encodeURIComponent(boardName)}` +
          `&yearId=${encodeURIComponent(y.year_id)}` +
          `&yearLabel=${encodeURIComponent(y.label)}`
        );
        return;
      }

      $('content').innerHTML = `<div class="grid">${rows.map(y => {
        const count = Number(y.unit_count || 0);
        return `
          <a class="tile" href="subjects.html?step=tree&subject=${encodeURIComponent(subjectId)}&boardName=${encodeURIComponent(boardName)}&yearId=${encodeURIComponent(y.year_id)}&yearLabel=${encodeURIComponent(y.label)}">
            <div class="head"><h3 class="name">${esc(y.label)}</h3></div>
            <span class="meta">${count} unit${count === 1 ? '' : 's'}</span>
          </a>`;
      }).join('')}</div>`;
    }

    // ---- step 4: duolingo-style tree ----------------------------------
    async function renderTree() {
      const subjectId  = params.get('subject');
      const boardName  = params.get('boardName');
      const yearIdArg  = params.get('yearId');
      const yearLabel  = params.get('yearLabel') || '';
      if (!subjectId || !boardName) { showErr('Missing subject or board.'); return; }

      $('pageTitle').textContent = 'Your lesson path';
      $('pageSub').textContent = 'Complete a lesson to unlock the next one.';
      $('content').innerHTML = '<div class="skel">Loading your path…</div>';

      let boardId = null;
      let yearId  = null;
      let resolvedYearLabel = yearLabel;

      // Resolve board name → board_id via list_boards_for_subject.
      try {
        const { data: boards, error: bErr } = await supabaseClient.rpc('list_boards_for_subject', {
          p_subject: subjectId,
        });
        if (bErr) throw bErr;
        const board = (boards || []).find(b => b.name === boardName);
        if (!board) throw new Error('Board "' + boardName + '" not found.');
        boardId = board.board_id;
      } catch (e) {
        $('content').innerHTML = '';
        showErr('Couldn\'t look up board: ' + (e.message || e));
        return;
      }

      // Year resolution:
      //   - If yearId was passed in URL, use it directly (the picker step
      //     put it there). This is the happy path.
      //   - Otherwise (deep-link from elsewhere), pick the first year that
      //     has units for (subject, board).
      if (yearIdArg) {
        yearId = yearIdArg;
        if (!resolvedYearLabel) {
          const { data: years } = await supabaseClient.rpc('list_years_for_subject_board', {
            p_subject: subjectId, p_board: boardId,
          });
          const y = (years || []).find(r => r.year_id === yearId);
          if (y) resolvedYearLabel = y.label;
        }
      } else {
        try {
          const { data: years, error: yErr } = await supabaseClient.rpc('list_years_for_subject_board', {
            p_subject: subjectId, p_board: boardId,
          });
          if (yErr) throw yErr;
          const rows = years || [];
          if (rows.length === 0) throw new Error('No years for this board.');
          // Prefer Year 10 → Year 11 → first available.
          const pick =
            rows.find(r => r.label === 'Year 10') ||
            rows.find(r => r.label === 'Year 11') ||
            rows[0];
          yearId = pick.year_id;
          resolvedYearLabel = pick.label;
        } catch (e) {
          $('content').innerHTML = '';
          showErr('Couldn\'t pick a year: ' + (e.message || e));
          return;
        }
      }

      if (!yearId) {
        $('content').innerHTML = '<div class="skel">No published units for this subject + board yet.</div>';
        return;
      }

      setCrumbs([
        { label: 'Subjects', href: 'subjects.html' },
        { label: boardName, href: `subjects.html?step=board&subject=${encodeURIComponent(subjectId)}` },
        ...(resolvedYearLabel ? [{ label: resolvedYearLabel }] : []),
      ]);

      const { data: rows, error: treeErr } = await supabaseClient.rpc('get_unit_tree', {
        p_subject: subjectId,
        p_board:   boardId,
        p_year:    yearId,
      });
      if (treeErr) {
        $('content').innerHTML = '';
        showErr('Couldn\'t load the lesson tree: ' + treeErr.message);
        return;
      }

      if (!rows || rows.length === 0) {
        $('content').innerHTML = '<div class="skel">No published lessons for this year yet. Check back soon.</div>';
        return;
      }

      // Build the nested structure.
      const units = [];
      const unitMap = new Map();
      for (const r of rows) {
        let u = unitMap.get(r.unit_id);
        if (!u) {
          u = { id: r.unit_id, name: r.unit_name, sort_order: r.unit_sort_order,
                description: r.unit_description, topics: [] };
          unitMap.set(r.unit_id, u);
          units.push(u);
        }
        let t = u.topics.find(t => t.id === r.topic_id);
        if (!t) {
          t = { id: r.topic_id, name: r.topic_name, order_index: r.topic_order_index,
                lessons: [] };
          u.topics.push(t);
        }
        t.lessons.push({
          id: r.lesson_id, title: r.lesson_title,
          order_index: r.lesson_order_index, status: r.lesson_status,
        });
      }

      // Server-side lock check per lesson.
      const ids = rows.map(r => r.lesson_id);
      const lockMap = new Map();
      await Promise.all(ids.map(async (id) => {
        try {
          const { data } = await supabaseClient.rpc('is_lesson_unlocked', { p_lesson: id });
          lockMap.set(id, !!data);
        } catch (_) {
          lockMap.set(id, false);
        }
      }));
      // Completed lessons are always unlocked.
      for (const u of units) for (const t of u.topics) for (const l of t.lessons) {
        if (l.status === 'completed') lockMap.set(l.id, true);
      }

      const nextHref = encodeURIComponent(
        `subjects.html?step=tree&subject=${subjectId}` +
        `&boardName=${encodeURIComponent(boardName)}` +
        `&yearId=${encodeURIComponent(yearId)}` +
        `&yearLabel=${encodeURIComponent(resolvedYearLabel)}`
      );

      const html = units.map((u, i) => {
        const topicsHtml = u.topics.map(t => {
          const chips = t.lessons.map(l => {
            const completed = l.status === 'completed';
            const unlocked = lockMap.get(l.id) === true;
            let cls = 'lesson-chip';
            let icon = '▶';
            if (completed) { cls += ' completed'; icon = '✓'; }
            else if (!unlocked) { cls += ' locked'; icon = '🔒'; }
            else { cls += ' available'; }
            const tag = unlocked ? 'a' : 'span';
            const href = unlocked
              ? `lesson.html?lesson=${encodeURIComponent(l.id)}&next=${nextHref}`
              : null;
            return `<${tag} class="${cls}" ${href ? `href="${href}"` : ''} ${href ? '' : 'aria-disabled="true"'}>
              <span class="icon">${icon}</span>
              <span class="title">${esc(l.title)}</span>
            </${tag}>`;
          }).join('');
          return `<div class="topic">
            <h4 class="topic-name">${esc(t.name)}</h4>
            <div class="lessons">${chips}</div>
          </div>`;
        }).join('');
        return `<div class="unit">
          <div class="unit-head">
            <span class="num">${i + 1}</span>
            <h3 class="title">${esc(u.name)}</h3>
          </div>
          ${u.description ? `<p class="desc">${esc(u.description)}</p>` : ''}
          ${topicsHtml}
        </div>`;
      }).join('');

      $('content').innerHTML = html;
    }

    init();
  </script>
  <script src="bubbles.js" defer></script>
</body>
</html>
